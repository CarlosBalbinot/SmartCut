version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: smartcut_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartcut
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: smartcut_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartcut -d smartcut_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: smartcut_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smartcut:senha@postgres:5432/smartcut_db
      SECRET_KEY: chave-secreta-aqui
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: 50
      NESTING_TIMEOUT_SEC: 120
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: smartcut_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  postgres_data:
  uploads_data:
