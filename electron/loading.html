<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCut</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #F5F5F7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(37, 150, 190, 0.2);
      border-top-color: #2596be;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 {
      font-size: 20px;
      font-weight: 700;
      color: #1D1D1F;
      letter-spacing: -0.4px;
      margin-bottom: 6px;
    }
    p {
      font-size: 13px;
      color: #6E6E73;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>SmartCut</h2>
  <p>Iniciando o sistema…</p>
</body>
</html>
