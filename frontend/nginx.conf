# nginx — SmartCut frontend de produção.
# Servidor de arquivos estáticos + proxy reverso das APIs para o backend.
# Respeita a CSP estrita do index.html (registrada como meta tag) — nenhum
# header extra é necessário, e nada de scripts inline é servido daqui.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Limite alinhado ao backend (MAX_FILE_SIZE_MB).
    client_max_body_size 50m;

    # Proxy das APIs para o backend (o antigo /uploads público virou
    # /api/v1/uploads autenticado — item 2.1; tudo passa por /api).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Assets com hash do Vite: cache longo e imutável.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback (rotas client-side do React).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
